<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preview VIP • Gabriela Marques</title>
  <style>
    body{font-family:system-ui,Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#071020;color:#fff}
    .card{max-width:560px;padding:28px;border-radius:12px;background:linear-gradient(180deg,#071426,#0b2030);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}
    h1{margin:0 0 10px;font-size:22px}
    p{color:#cbd5e1;margin:0 0 18px;line-height:1.4}
    .btn{display:inline-block;background:#ff3b6b;color:#fff;padding:14px 22px;border-radius:10px;font-weight:700;text-decoration:none}
    .small{font-size:13px;color:#9fb0c8;margin-top:12px}
    .muted{font-size:12px;color:#7b8fa0;margin-top:8px}
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="titulo">
    <h1 id="titulo">Prévia VIP — Conteúdo Exclusivo</h1>
    <p>Acesse prévias e ofertas exclusivas. Somente maiores de 18 anos. Clique em “Sou maior” para prosseguir.</p>

    <a class="btn" href="#" onclick="return goTelegram()">Sou MAIOR — Entrar</a>

    <div class="small">Mais de <strong>3.000</strong> membros — atualizações diárias.</div>
    <div class="muted">Redirecionamento automático em alguns segundos…</div>
  </div>

  <script>
    // LINK DO SEU GRUPO - NÃO CAGA NISSO
    const TELEGRAM_INVITE = "https://t.me/+pBbicFb5hhU5MTUx";
    const TELEGRAM_DEEPLINK = "tg://join?invite=pBbicFb5hhU5MTUx";

    function goTelegram() {
      try {
        if (typeof fbq === 'function') {
          fbq('track', 'ViewContent', {content_name: 'telegram_prelanding'});
        }
      } catch(e){}

      // tenta abrir app
      window.location.href = TELEGRAM_DEEPLINK;

      // fallback web (se app não abrir)
      setTimeout(function () {
        window.location.href = TELEGRAM_INVITE;
      }, 1200);

      return false;
    }

    // REDIRECT AUTOMÁTICO EM 5 SEGUNDOS (SEM CLICAR)
    setTimeout(function () {
      goTelegram();
    }, 5000);
  </script>
</body>
</html>
